# 行情快照 / 标的关联 / 信号回测（market_snapshot.py、ticker_link.py、signal_outcomes.py 读取）

timezone: "Asia/Shanghai"

enabled: true

# 快照时点（allow_late_minutes = 迟到宽限，超时记 missed）
snapshot_points:
  - {time: "09:25", label: "盘前",  allow_late_minutes: 10}
  - {time: "11:30", label: "午收",  allow_late_minutes: 10}
  - {time: "15:00", label: "收盘",  allow_late_minutes: 180}

# 快照类别（顺序即抓取顺序）
snapshot_kinds: ["index", "industry_board", "concept_board"]

# 指数清单
indices:
  - {code: "000001.SH", name: "上证指数"}
  - {code: "399001.SZ", name: "深证成指"}
  - {code: "399006.SZ", name: "创业板指"}
  - {code: "000300.SH", name: "沪深300"}
  - {code: "000905.SH", name: "中证500"}
  - {code: "000688.SH", name: "科创50"}
  - {code: "899050.BJ", name: "北证50"}

# 回测基准
benchmark:
  symbol: "000300.SH"
  source: "akshare_index"
  name: "沪深300"

# 新闻 → 标的 关联
link:
  enabled: true
  universe_refresh_days: 30   # 简称字典刷新间隔（天）
  max_links_per_news: 8       # 单条新闻最多关联数

# 信号与回测
signal:
  enabled: true
  horizons: [1, 3, 5, 10]     # 持有交易日数
  compute_limit_per_run: 120  # 每次 evening 处理行数上限
  # 方向判断：标题利好/利空词表基线
  lexicon:
    up:
      - "涨停"
      - "大涨"
      - "飙升"
      - "暴涨"
      - "利好"
      - "重大利好"
      - "预增"
      - "大幅增长"
      - "大增"
      - "中标"
      - "签约"
      - "订单"
      - "获批"
      - "获准"
      - "增持"
      - "回购"
      - "举牌"
      - "扭亏"
      - "分红"
      - "送转"
      - "收购"
      - "重组"
      - "合并"
      - "新高"
      - "涨价"
      - "提价"
      - "突破"
      - "量产"
      - "投产"
      - "扩产"
      - "超预期"
      - "净买入"
      - "加仓"
      - "战略合作"
      - "翻倍"
    down:
      - "跌停"
      - "大跌"
      - "暴跌"
      - "重挫"
      - "利空"
      - "重大利空"
      - "预亏"
      - "预减"
      - "首亏"
      - "亏损"
      - "巨亏"
      - "减持"
      - "清仓"
      - "立案"
      - "调查"
      - "处罚"
      - "警示函"
      - "监管函"
      - "退市"
      - "风险警示"
      - "违约"
      - "逾期"
      - "爆雷"
      - "商誉减值"
      - "诉讼"
      - "仲裁"
      - "冻结"
      - "强制平仓"
      - "下调"
      - "评级下调"
      - "解禁"
      - "终止"
      - "取消"
      - "召回"
      - "不合格"
      - "违规"
      - "被查"
      - "立案调查"

# 与 news_scheduler 的联动钩子
hooks:
  auto_link: true             # 新闻窗口后关联标的
  auto_signals: true          # evening：建当日信号
  auto_compute: true          # evening：结算可结算信号
  auto_report: true           # evening：重算回测面板
  refresh_watchlist: true     # evening：刷新 watchlist 日线
  auto_predict_morning: true  # 08:40 盘前生成当日领涨/风险主题预测
  auto_predict_evening: true  # evening：结算 vs_outcome + 复盘反思
  auto_baseline: true         # evening：基线对照（只读）

# 全市场个股快照 + 板块成分（供"板块→个股"映射）
stock_snapshot:
  enabled: true
  slot: "15:00"
  allow_late_minutes: 180      # 收盘后宽限（分钟）
  page_size: 100               # 每页条数上限
  requests_timeout: 20

board_members:
  enabled: true
  kinds: ["industry_board"]
  include_concepts: false      # true 时追加 concept_board
  max_boards: 60               # 0 表示不限制
  refresh_days: 30             # 成分表刷新间隔（天）
  request_delay_seconds: 0.4   # 板块间限速

reports:
  dir: "/mnt/d/数据库/报告"
  days: 90                # 面板统计窗口（近 N 天信号）
